[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-scan"
version = "0.1.0"
description = "Composable TM-Scan analyses of mapped fracture traces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23", "pandas>=1.5", "scipy>=1.9",
    "scikit-learn>=1.1", "shapely>=1.8", "geopandas>=0.12",
    "matplotlib>=3.6", "joblib>=1.3", "numba>=0.59",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
